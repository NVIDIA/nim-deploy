# Kubernetes Job: run NAT profiler eval (`nat eval`) for the latency sensitivity demo.
#
# Equivalent local command (from NeMo-Agent-Toolkit repo root):
#   nat eval --reps 2 --config_file .../configs/<config yaml basename>
#
# This file is a template: set env vars for gettext envsubst (see k8s/apply_config_profile_jobs.sh).
# Substituted keys: JOB_NAME, JOB_BASE, NAT_CONFIG_BASENAME, DYNAMO_OPENAI_BASE_URL, NAT_EVAL_REPS, NAT_PERF_DEBUG.
# JOB_NAME includes a timestamp when using the script; JOB_BASE is the stable id (label nat-profile-job).
# NAT passes Dynamo URL and reps via nat eval CLI flags; NAT_PERF_DEBUG uses env(1) on the command line (no nat flag).
#
# Prerequisites:
# - Image pushed to ACR (same image as nat-dynamo-serve): anslutskycontainerappacr.azurecr.io/nat-dynamo-serve:latest
# - Dynamo OpenAI-compatible endpoint reachable from the pod (NOT localhost unless Dynamo is in the same container).
#   The Job passes --override llms.dynamo_llm.base_url with DYNAMO_OPENAI_BASE_URL from apply/restart scripts.
# - AKS can pull from ACR (attach ACR or imagePullSecrets — same as nat-dynamo-serve.yaml).
#
# Logs (replace JOB_NAME with the name you applied):
#   kubectl logs -n nat-dynamo job/JOB_NAME -f
#
# Fetch prediction trie from a succeeded pod (outputs dir is inside the container unless you add a volume):
#   POD=$(kubectl get pods -n nat-dynamo -l job-name=JOB_NAME -o jsonpath='{.items[0].metadata.name}')
#   kubectl cp -n nat-dynamo "$POD:/opt/nat/NeMo-Agent-Toolkit/examples/dynamo_integration/latency_sensitivity_demo/outputs/profile/prediction_trie.json" ./prediction_trie.json
#
# Delete completed job:
#   kubectl delete job JOB_NAME -n nat-dynamo

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: nat-dynamo
  labels:
    app: ${JOB_NAME}
    nat-profile-job: ${JOB_BASE}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: ${JOB_NAME}
        nat-profile-job: ${JOB_BASE}
    spec:
      restartPolicy: Never
      # Uncomment if not using `az aks update --attach-acr anslutskycontainerappacr`:
      # imagePullSecrets:
      #   - name: acr-creds
      containers:
        - name: nat-eval
          image: anslutskycontainerappacr.azurecr.io/nat-dynamo-serve:latest
          imagePullPolicy: Always
          workingDir: /opt/nat/NeMo-Agent-Toolkit
          # Reps, Dynamo base URL, and NAT_PERF_DEBUG are supplied via envsubst from apply/restart scripts (CLI-style:
          # nat eval --reps … --override llms.dynamo_llm.base_url … ; NAT_PERF_DEBUG via env(1) — no dedicated nat flag).
          # Default matches workflow.yaml / config_profile cluster DNS. If you see openai.APIConnectionError from nat eval,
          # verify from a debug pod: kubectl run curl --rm -it --restart=Never --image=curlimages/curl -- curl -sS -o /dev/null -w "%{http_code}" http://agg-8xtp2-frontend.dynamo-cloud.svc.cluster.local:8000/v1/models
          command:
            - /bin/sh
            - -c
            - >
              exec env NAT_PERF_DEBUG="${NAT_PERF_DEBUG}"
              nat eval --reps "${NAT_EVAL_REPS}"
              --config_file /opt/nat/NeMo-Agent-Toolkit/examples/dynamo_integration/latency_sensitivity_demo/src/latency_sensitivity_demo/configs/${NAT_CONFIG_BASENAME}
              --override llms.dynamo_llm.base_url "${DYNAMO_OPENAI_BASE_URL}"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
