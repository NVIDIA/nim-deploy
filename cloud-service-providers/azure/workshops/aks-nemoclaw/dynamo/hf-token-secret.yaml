# Hugging Face API token for Dynamo workers (envFromSecret: hf-token-secret).
# Replace REPLACE_ME with your token from https://huggingface.co/settings/tokens
# The data key must be HF_TOKEN (not HUGGING_FACE_HUB_TOKEN).
#
# Apply in the same namespace as your DynamoGraphDeployment, for example:
#   kubectl apply -f hf-token-secret.yaml -n default
apiVersion: v1
kind: Secret
metadata:
  name: hf-token-secret
type: Opaque
stringData:
  HF_TOKEN: YOUR_HF_TOKEN
