# Public HTTP LoadBalancer for NemoClaw (namespace: nemoclaw).
#
# This file contains:
# - A LoadBalancer Service (inbound only: who can reach the UI on port 80 → 18789).
# - A NetworkPolicy that explicitly allows all pod egress (any IP, any port, any protocol).
#   A Kubernetes Service does not restrict outbound connections from pods; egress is governed
#   by NetworkPolicy (if any). The policy below matches the main NemoClaw pod and unions an
#   unrestricted egress allow-list so outbound traffic is not limited by this workshop manifest.
#
# Naming (defaults below match a single pod named "nemoclaw"):
# - Service metadata.name: <pod-name>-http (default: nemoclaw-http).
# - nemoclaw.io/instance on the Pod and in Service/NetworkPolicy selectors: <pod-name> (default: nemoclaw).
# - NetworkPolicy metadata.name: <pod-name>-allow-all-egress (default: nemoclaw-allow-all-egress).
#
# deploy_nemoclaw_k8s.sh applies this file with sed: namespace, Service name, instance label value,
# and NetworkPolicy name are aligned with --nemoclaw-pod-name / NEMOCLAW_POD_NAME (and optional
# NEMOCLAW_LB_SVC_NAME override). Manual kubectl apply uses the defaults in this file as-is.
#
# Prerequisites:
# - Pod must set CHAT_UI_URL to a non-loopback URL so the dashboard forward binds 0.0.0.0:18789
#   on the pod network (required for this Service). For browser access via this LoadBalancer,
#   CHAT_UI_URL must also match the public origin (e.g. http://<EXTERNAL-IP>) so the gateway
#   allows that Origin in gateway.controlUi.allowedOrigins — not only the in-cluster Service DNS.
# - Pod from nemoclaw-k8s.yaml uses labels app=nemoclaw and nemoclaw.io/instance equal to the
#   pod metadata.name (default instance label nemoclaw) so the Service selector targets only that pod.
# - AKS (or other cloud) provisions EXTERNAL-IP on the Service; wait until
#   kubectl get svc shows a real address instead of <pending>.
#
# Optional (Azure static public IP): create a Standard SKU public IP in the
# node resource group, then set service annotations per AKS docs.
#
# Apply: kubectl apply -f nemoclaw-ingress.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: nemoclaw-http
  namespace: nemoclaw
  labels:
    app: nemoclaw
spec:
  type: LoadBalancer
  selector:
    app: nemoclaw
    nemoclaw.io/instance: nemoclaw
  ports:
    - name: http
      port: 80
      targetPort: 18789
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nemoclaw-allow-all-egress
  namespace: nemoclaw
  labels:
    app: nemoclaw
spec:
  podSelector:
    matchLabels:
      app: nemoclaw
      nemoclaw.io/instance: nemoclaw
  policyTypes:
    - Egress
  egress:
    # Empty rule: allow egress to all IPs, all ports, all protocols (no outbound restrictions).
    - {}
