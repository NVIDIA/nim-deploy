#
# OpenClaw sandbox network policy (development / lab). Egress CONNECT is
# allowed to resolved addresses in the full IPv4/IPv6 allowlist on TCP ports
# 80 and 443 only. Loopback and link-local remain blocked inside OpenShell.
# Kubernetes API/etcd/kubelet ports remain hard-blocked in the proxy regardless
# of policy — see OpenShell BLOCKED_CONTROL_PLANE_PORTS.
#
# To add endpoints: update this file and re-run `nemoclaw onboard`
# or apply dynamically via `openshell policy set`.

version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    # Parent of pvc-blob mount: Landlock needs this to traverse/list /mnt
    # when /mnt/blob is allowed (otherwise `ls /mnt` → Permission denied).
    - /mnt
    # .openclaw is writable (read_write) — see below.
    # Ref: https://github.com/NVIDIA/NemoClaw/issues/514
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /sandbox/.openclaw             # Writable OpenClaw config/state under home
    - /sandbox/.openclaw/openclaw.json  # Writable main OpenClaw config file
    - /sandbox/.openclaw-data       # Writable agent/plugin state (symlinked from .openclaw)
    - /mnt/blob

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  unrestricted:
    name: unrestricted
    endpoints:
      - allowed_ips:
          - "0.0.0.0/0"
          - "::/0"
        access: full
        ports:
          - 80
          - 443
    binaries:
      - { path: "/**" }
