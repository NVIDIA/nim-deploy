#
# Shared Hugging Face hub cache on PVC nemotron-shared-hf-cache (see ../../../../../model_pull_job/).
#
# IMPORTANT — Nemotron-H / hybrid Mamba models and vLLM + NIXL disaggregation:
#   With --kv-transfer-config, vLLM disables the hybrid KV cache manager. NemotronH then
#   hits: "Hybrid KV cache manager is disabled but failed to convert the KV cache specs
#   to one unified type." This is an upstream vLLM limitation, not misconfiguration.
#   Use instead:
#     - vLLM aggregated Nemotron: recipes/nemotron-3-super-fp8/vllm/agg/deploy.yaml
#     - Disagg + Nemotron: SGLang or TRT-LLM (see recipes/nemotron-3-super-fp8/README.md)
#   This manifest uses Qwen3 for a working NIXL disagg example against the same PVC layout.
#
# Azure Files: set HF_MODULES_CACHE off the PVC so Transformers can chmod dynamic modules.
#
# Multi-GPU (TP>1): VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm avoids known graph-capture issues.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg
spec:
  pvcs:
    - create: false
      name: nemotron-shared-hf-cache
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          workingDir: /workspace
          command:
            - python3
          args:
            - -m
            - dynamo.frontend
            # - --router-mode
            # - kv
            # - --no-kv-events
    VllmDecodeWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: decode
      replicas: 1
      resources:
        limits:
          gpu: "2"
        requests:
          custom:
            ephemeral-storage: "200Gi"
      envs:
        - name: HF_HOME
          value: /home/dynamo/.cache/huggingface
      volumeMounts:
        - name: nemotron-shared-hf-cache
          mountPoint: /home/dynamo/.cache/huggingface
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          workingDir: /workspace/examples/backends/vllm
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_MODULES_CACHE
              value: /tmp/hf-transformers-modules
            - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
              value: "trtllm"
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
            - --trust-remote-code
            - --no-enable-prefix-caching
            - --disaggregation-mode
            - decode
    VllmPrefillWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: prefill
      replicas: 1
      resources:
        limits:
          gpu: "2"
        requests:
          custom:
            ephemeral-storage: "200Gi"
      envs:
        - name: HF_HOME
          value: /home/dynamo/.cache/huggingface
      volumeMounts:
        - name: nemotron-shared-hf-cache
          mountPoint: /home/dynamo/.cache/huggingface
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          workingDir: /workspace/examples/backends/vllm
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_MODULES_CACHE
              value: /tmp/hf-transformers-modules
            - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
              value: "trtllm"
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
            - --no-enable-prefix-caching
            - --trust-remote-code
            - --disaggregation-mode
            - prefill
            - --kv-transfer-config
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
